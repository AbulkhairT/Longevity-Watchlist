name: Z.ai smoke test

# Manual only. Sends one tiny request to glm-4.7-flash and prints status,
# returned model name, whether the reply was JSON, and token counts.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Call Z.ai once
        env:
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
        run: npm run --silent zai:smoke
